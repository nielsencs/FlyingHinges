<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Bus Routes 24, 26 & 77 – Zoomable Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height:100%; margin:0; }
    .legend {
      position: absolute; bottom: 16px; left: 16px; z-index: 500;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15); font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .legend h3 { margin: 0 0 6px; font-size: 15px; }
    .legend .item { display:flex; align-items:center; gap:8px; margin: 6px 0; }
    .legend .swatch { width: 20px; height: 4px; border-radius: 2px; background:#000; }
    .legend button { margin-left: 8px; padding: 4px 8px; border:1px solid #ddd; border-radius: 8px; background: #f8f8f8; cursor: pointer; }
    .legend button.active { background:#e8f5ff; border-color:#b6dbff; }
    .attribution-note { position: absolute; right: 12px; bottom: 12px; z-index: 400; font: 12px/1.2 system-ui, -apple-system, Segoe UI; background: rgba(255,255,255,0.85); padding: 4px 6px; border-radius: 6px;}
  </style>
</head>
<body>
  <div id="map" aria-label="Zoomable map of London bus routes 24, 26 and 77"></div>
  <div class="legend" id="legend">
    <h3>Routes</h3>
    <div class="item"><span class="swatch" style="background:#e53935"></span> 24 <button data-ref="24" class="toggle active" aria-pressed="true">Hide</button></div>
    <div class="item"><span class="swatch" style="background:#1e88e5"></span> 26 <button data-ref="26" class="toggle active" aria-pressed="true">Hide</button></div>
    <div class="item"><span class="swatch" style="background:#43a047"></span> 77 <button data-ref="77" class="toggle active" aria-pressed="true">Hide</button></div>
    <div style="margin-top:8px; font-size:12px; color:#444">Live geometry from OpenStreetMap via Overpass. If nothing loads, try refreshing once.</div>
  </div>
  <div class="attribution-note">Data © OpenStreetMap contributors • Map © OSM</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
  <script>
    // --- Map setup ---
    const map = L.map('map', { zoomControl: true }).setView([51.5074, -0.1278], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Maintain per-route layer groups so we can toggle easily
    const routeLayers = {
      '24': L.layerGroup().addTo(map),
      '26': L.layerGroup().addTo(map),
      '77': L.layerGroup().addTo(map)
    };

    const colors = { '24': '#e53935', '26': '#1e88e5', '77': '#43a047' };

    // Overpass helpers (primary + fallback endpoints)
    const OVERPASS_ENDPOINTS = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.ru/api/interpreter'
    ];

    function overpassQueryForRef(ref) {
      // Constrain to Greater London area by name to avoid same-number routes elsewhere in UK
      return `
        [out:json][timeout:60];
        area["name"="Greater London"]["boundary"="administrative"]["admin_level"="6"]->.searchArea;
        (
          relation(area.searchArea)["type"="route"]["route"="bus"]["ref"="${ref}"];
        );
        (._;>;);
        out body;`;
    }

    async function fetchOverpass(query) {
      for (const endpoint of OVERPASS_ENDPOINTS) {
        try {
          const res = await fetch(endpoint, { method: 'POST', body: query, headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          return json;
        } catch (e) {
          // try next endpoint
          console.warn('Overpass fetch failed on this endpoint, trying next:', e);
        }
      }
      throw new Error('All Overpass endpoints failed');
    }

    function featureStyle(ref) {
      return {
        color: colors[ref] || '#d32f2f',
        weight: 4,
        opacity: 0.9
      };
    }

    function bindPopupForFeature(feature, layer) {
      if (feature && feature.properties) {
        const p = feature.properties;
        const tags = p.tags || {};
        const name = tags.name || `Route ${tags.ref || ''}`.trim();
        const ref = tags.ref || '';
        const from = tags.from || '';
        const to = tags.to || '';
        const operator = tags.operator || tags.network || '';
        const dir = tags.direction || '';
        const title = name || `Route ${ref}`;
        const html = `
          <div style="min-width:220px">
            <div style="font-weight:600; margin-bottom:4px">${title}</div>
            <div>${from && to ? `${from} → ${to}` : ''}</div>
            <div style="color:#555; font-size:12px; margin-top:6px">${operator ? `Operator: ${operator}` : ''}${dir ? ` • ${dir}` : ''}</div>
          </div>`;
        layer.bindPopup(html);
      }
    }

    async function addRoute(ref) {
      try {
        const query = 'data=' + encodeURIComponent(overpassQueryForRef(ref));
        const json = await fetchOverpass(query);
        const geo = osmtogeojson(json);

        // Filter to only relation features (the actual routes), then draw their member ways
        const group = routeLayers[ref];
        group.clearLayers();

        const bounds = [];

        L.geoJSON(geo, {
          style: featureStyle(ref),
          filter: f => (f.geometry && (f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString')),
          onEachFeature: (feature, layer) => {
            bindPopupForFeature(feature, layer);
            if (feature.geometry.type === 'LineString') {
              feature.geometry.coordinates.forEach(c => bounds.push([c[1], c[0]]));
            } else if (feature.geometry.type === 'MultiLineString') {
              feature.geometry.coordinates.forEach(line => line.forEach(c => bounds.push([c[1], c[0]])));
            }
          }
        }).addTo(group);

        if (bounds.length) {
          // Fit only initially when first routes load (avoid jumping on later toggles)
          if (!addRoute._fitted) {
            map.fitBounds(bounds, { padding: [30, 30] });
            addRoute._fitted = true;
          }
        }
      } catch (err) {
        console.error('Failed to load route', ref, err);
        const group = routeLayers[ref];
        group.addLayer(L.marker(map.getCenter()).bindPopup(`Could not load route ${ref}. Try refreshing.`));
      }
    }

    // Load the three routes
    ['24','26','77'].forEach(addRoute);

    // Legend / toggles
    document.querySelectorAll('.toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const ref = btn.dataset.ref;
        const on = map.hasLayer(routeLayers[ref]);
        if (on) {
          map.removeLayer(routeLayers[ref]);
          btn.textContent = 'Show';
          btn.classList.remove('active');
          btn.setAttribute('aria-pressed', 'false');
        } else {
          routeLayers[ref].addTo(map);
          btn.textContent = 'Hide';
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
        }
      });
    });
  </script>
</body>
</html>
